<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Gestaltungsvorschau der Website von Anna-Lena’s Kinderkörbchen">
  <rect width="1440" height="900" fill="#FBF7EF"/>

  <!-- Kopfbereich -->
  <rect x="0" y="0" width="1440" height="76" fill="#FDFBF6"/>
  <line x1="0" y1="76" x2="1440" y2="76" stroke="#E7E0D2" stroke-width="1"/>
  <rect x="60" y="16" width="128" height="46" rx="9" fill="#FFFFFF" stroke="#D8CDB6" stroke-width="1.5"/>
  <text x="124" y="38" text-anchor="middle" font-family="'Bricolage Grotesque', Inter, sans-serif" font-size="13" font-weight="700" fill="#4F7A46">Anna-Lena’s</text>
  <text x="124" y="54" text-anchor="middle" font-family="'Bricolage Grotesque', Inter, sans-serif" font-size="14" font-weight="700" fill="#C08A3E">Kinderkörbchen</text>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="204" y="35" font-size="15" font-weight="600" fill="#3C3A35">Kindertagespflege</text>
    <text x="204" y="55" font-size="12" fill="#8A8578">Anna-Lena Korb · Eisingen</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="15" fill="#54514A">
    <text x="470" y="45" fill="#4F7A46" font-weight="600">Start</text>
    <line x1="466" y1="54" x2="510" y2="54" stroke="#4F7A46" stroke-width="2"/>
    <text x="536" y="45">Über mich</text>
    <text x="634" y="45">Betreuung</text>
    <text x="734" y="45">Haus &amp; Garten</text>
    <text x="866" y="45">Essen</text>
    <text x="934" y="45">Preise</text>
    <text x="1002" y="45">Kontakt</text>
  </g>
  <rect x="1188" y="18" width="120" height="42" rx="21" fill="#4F7A46"/>
  <text x="1248" y="45" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Anrufen</text>

  <!-- Hero-Fläche -->
  <rect x="0" y="76" width="1440" height="824" fill="#F6EFE2"/>
  <!-- angedeutete Porträtfläche rechts (kein echtes Foto) -->
  <rect x="720" y="76" width="720" height="824" fill="#EADFCB"/>
  <circle cx="1080" cy="430" r="132" fill="#DCCDB2"/>
  <path d="M948 726 C952 610 1006 542 1080 542 C1154 542 1208 610 1212 726 Z" fill="#E4D8C0"/>
  <text x="1080" y="820" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="15" letter-spacing="2" fill="#A2967E">PORTRÄTFOTO</text>

  <rect x="72" y="222" width="360" height="42" rx="21" fill="#FDFBF6" stroke="#E2D9C6"/>
  <text x="252" y="249" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#4F7A46">Kindertagespflege in Eisingen bei Würzburg</text>

  <g font-family="'Bricolage Grotesque', Inter, sans-serif" font-size="60" font-weight="700" fill="#4A3F2E" letter-spacing="-1.5">
    <text x="70" y="344">Schön, dass du da</text>
    <text x="70" y="412">bist.</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="17" fill="#6B6455">
    <text x="72" y="470">Manche Orte fühlen sich vom ersten Moment an richtig an.</text>
    <text x="72" y="522">Im Kinderkörbchen erleben Kinder ein echtes Zuhause auf Zeit:</text>
    <text x="72" y="550">eine kleine Gemeinschaft, viel Platz im Haus und Garten, klare</text>
    <text x="72" y="578">Regeln und einen Alltag, in dem sie mithelfen und selbstständig</text>
    <text x="72" y="606">werden dürfen.</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="15">
    <text x="72" y="654" fill="#4F7A46">Geborgenheit</text>
    <text x="188" y="654" fill="#A2967E">·</text>
    <text x="206" y="654" fill="#B4736C">Vertrauen</text>
    <text x="298" y="654" fill="#A2967E">·</text>
    <text x="316" y="654" fill="#4F7A46">Zeit</text>
  </g>
  <rect x="72" y="690" width="248" height="52" rx="26" fill="#4F7A46"/>
  <text x="196" y="722" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Kinderkörbchen kennenlernen</text>
  <rect x="340" y="690" width="176" height="52" rx="26" fill="none" stroke="#4F7A46" stroke-width="1.5"/>
  <text x="428" y="722" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#4F7A46">Platz anfragen</text>
</svg>
